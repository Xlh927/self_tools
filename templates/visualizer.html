<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标注可视化工具 - Annotation Visualizer</title>
    <meta name="description" content="可视化数据集标注">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>标注可视化工具</h1>
            </div>
            <p class="subtitle">自动检测标注格式并可视化到图像上</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="{{ tool_id }}_visualizerForm">
                    <!-- Dataset Format -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_datasetFormat">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            数据集格式
                        </label>
                        <select id="{{ tool_id }}_datasetFormat" name="datasetFormat" required>
                            <option value="voc">VOC (XML)</option>
                            <option value="yolo">YOLO (TXT)</option>
                        </select>
                    </div>

                    <!-- Images Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_imagesDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            图片目录
                        </label>
                        <input type="text" id="{{ tool_id }}_imagesDir" name="imagesDir"
                            placeholder="例如: /path/to/images" required>
                    </div>

                    <!-- Annotations Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_annotationsDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            标注目录
                        </label>
                        <input type="text" id="{{ tool_id }}_annotationsDir" name="annotationsDir"
                            placeholder="例如: /path/to/annotations" required>
                    </div>

                    <!-- Classes File (Optional) -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_classesFile">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            类别文件 classes.txt
                            <span class="optional-hint">(可选，用于显示类别名称)</span>
                        </label>
                        <input type="text" id="{{ tool_id }}_classesFile" name="classesFile"
                            placeholder="例如: /path/to/classes.txt">
                    </div>

                    <!-- Options -->
                    <div class="params-section">
                        <h3 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="2" />
                                <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            显示选项
                        </h3>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="{{ tool_id }}_showLabels" name="showLabels" checked>
                                <span>显示类别标签</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="{{ tool_id }}_showConf" name="showConf">
                                <span>显示置信度 (如果有)</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="{{ tool_id }}_shuffle" name="shuffle">
                                <span>随机显示图片</span>
                            </label>
                        </div>
                        <div class="form-group" style="margin-top: 15px;">
                            <label for="{{ tool_id }}_maxImages">最大显示数量</label>
                            <input type="number" id="{{ tool_id }}_maxImages" name="maxImages" value="20" min="1"
                                max="100">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="{{ tool_id }}_submitBtn">
                        <span class="btn-text">开始可视化</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="{{ tool_id }}_progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="{{ tool_id }}_progressFill"></div>
                    </div>
                    <p class="progress-text" id="{{ tool_id }}_progressText">加载中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="{{ tool_id }}_resultSection" style="display: none;">
                    <div class="gallery-grid" id="{{ tool_id }}_galleryGrid"></div>
                    <div class="pagination" id="{{ tool_id }}_pagination" style="display: none;">
                        <button class="page-btn" id="{{ tool_id }}_prevPage">上一页</button>
                        <span class="page-info" id="{{ tool_id }}_pageInfo">1 / 1</span>
                        <button class="page-btn" id="{{ tool_id }}_nextPage">下一页</button>
                    </div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">🔍</div>
                    <h3>自动检测</h3>
                    <p>自动识别 VOC、YOLO、JSON 等标注格式</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🎨</div>
                    <h3>灵活可视化</h3>
                    <p>支持边界框和分割掩码两种显示模式</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">⚡</div>
                    <h3>批量处理</h3>
                    <p>快速处理整个数据集的可视化</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：先点击"检测类别"按钮,然后选择要可视化的类别</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/visualizer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smart-inputs.js') }}"></script>
</body>

</html>
