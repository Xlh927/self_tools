<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标注可视化工具 - Annotation Visualizer</title>
    <meta name="description" content="可视化数据集标注">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>标注可视化工具</h1>
            </div>
            <p class="subtitle">自动检测标注格式并可视化到图像上</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="visualizerForm">
                    <!-- Images Directory -->
                    <div class="form-group">
                        <label for="imagesDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            图片目录
                        </label>
                        <input type="text" id="imagesDir" name="imagesDir" placeholder="例如: /path/to/images" required>
                    </div>

                    <!-- Annotations Directory -->
                    <div class="form-group">
                        <label for="annotationsDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            标注目录
                        </label>
                        <input type="text" id="annotationsDir" name="annotationsDir"
                            placeholder="例如: /path/to/annotations" required>
                        <small class="help-text">支持 VOC (XML)、YOLO (TXT)、JSON 格式</small>
                    </div>

                    <!-- Output Directory -->
                    <div class="form-group">
                        <label for="outputDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 3v14M17 10H3" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            输出目录
                        </label>
                        <input type="text" id="outputDir" name="outputDir" placeholder="例如: /path/to/visualized"
                            required>
                    </div>

                    <!-- Detect Classes Button -->
                    <button type="button" class="submit-btn secondary" id="detectBtn">
                        <span class="btn-text">检测类别</span>
                    </button>

                    <!-- Class Selection -->
                    <div class="form-group" id="classSelectionGroup" style="display: none;">
                        <label>选择要可视化的类别</label>
                        <div id="classCheckboxes" class="checkbox-group"></div>
                    </div>

                    <!-- Draw Mode -->
                    <div class="form-group" id="drawModeGroup" style="display: none;">
                        <label>绘制模式</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="drawMode" value="bbox" checked>
                                <span>边界框 (BBox)</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="drawMode" value="mask">
                                <span>分割掩码 (Mask)</span>
                            </label>
                        </div>
                        <small class="help-text">如果标注为分割格式但选择边界框模式,将自动转换</small>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="submitBtn" style="display: none;">
                        <span class="btn-text">开始可视化</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">处理中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="result-content" id="resultContent"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">🔍</div>
                    <h3>自动检测</h3>
                    <p>自动识别 VOC、YOLO、JSON 等标注格式</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🎨</div>
                    <h3>灵活可视化</h3>
                    <p>支持边界框和分割掩码两种显示模式</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">⚡</div>
                    <h3>批量处理</h3>
                    <p>快速处理整个数据集的可视化</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：先点击"检测类别"按钮,然后选择要可视化的类别</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/visualizer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smart-inputs.js') }}"></script>
</body>

</html>
