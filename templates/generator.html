<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集生成器 - Dataset Generator</title>
    <meta name="description" content="从大图标注生成小型数据集，支持VOC/YOLO/JSON格式">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <path d="M8 12h24M8 20h24M8 28h16" stroke="white" stroke-width="3" stroke-linecap="round" />
                    <circle cx="30" cy="28" r="6" fill="white" opacity="0.8" />
                    <path d="M28 28l4 4" stroke="#667eea" stroke-width="2" stroke-linecap="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>数据集生成器</h1>
            </div>
            <p class="subtitle">从大图标注智能生成小型数据集</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="{{ tool_id }}_generatorForm">
                    <!-- Annotation Format -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_annotationFormat">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            标注格式
                        </label>
                        <select id="{{ tool_id }}_annotationFormat" name="annotationFormat" required>
                            <option value="voc">VOC (XML)</option>
                            <option value="yolo">YOLO (TXT)</option>
                            <option value="json">COCO (JSON)</option>
                        </select>
                    </div>

                    <!-- Images Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_imagesDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            图片目录
                        </label>
                        <input type="text" id="{{ tool_id }}_imagesDir" name="imagesDir"
                            placeholder="例如: /path/to/images" required>
                    </div>

                    <!-- Annotations Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_annotationsDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            标注目录
                        </label>
                        <input type="text" id="{{ tool_id }}_annotationsDir" name="annotationsDir"
                            placeholder="例如: /path/to/annotations" required>
                    </div>

                    <!-- Output Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_outputDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 3v14M17 10H3" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            输出目录
                        </label>
                        <input type="text" id="{{ tool_id }}_outputDir" name="outputDir"
                            placeholder="例如: /path/to/output" required>
                    </div>

                    <!-- Class Selection -->
                    <div class="form-group">
                        <label>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            目标类别
                        </label>
                        <div class="class-selection-container">
                            <button type="button" id="{{ tool_id }}_detectClassesBtn" class="secondary-btn small">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                自动检测类别
                            </button>
                            <div id="{{ tool_id }}_classSelectionGroup" class="class-checkbox-group">
                                <div class="empty-hint">请先设置标注目录并点击检测</div>
                            </div>
                        </div>
                    </div>

                    <!-- Window Size Section -->
                    <div class="params-section">
                        <h3 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                            </svg>
                            窗口大小
                        </h3>
                        <div class="params-grid">
                            <div class="form-group">
                                <label for="{{ tool_id }}_windowWidth">宽度 (px)</label>
                                <input type="number" id="{{ tool_id }}_windowWidth" name="windowWidth" value="640"
                                    min="64" max="8192" step="32" required>
                            </div>
                            <div class="form-group">
                                <label for="{{ tool_id }}_windowHeight">高度 (px)</label>
                                <input type="number" id="{{ tool_id }}_windowHeight" name="windowHeight" value="640"
                                    min="64" max="8192" step="32" required>
                            </div>
                        </div>
                    </div>

                    <!-- Stride Section -->
                    <div class="params-section">
                        <h3 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            滑动步长
                        </h3>
                        <div class="params-grid">
                            <div class="form-group">
                                <label for="{{ tool_id }}_strideX">横向 (px)</label>
                                <input type="number" id="{{ tool_id }}_strideX" name="strideX" value="320" min="32"
                                    max="4096" step="32" required>
                            </div>
                            <div class="form-group">
                                <label for="{{ tool_id }}_strideY">纵向 (px)</label>
                                <input type="number" id="{{ tool_id }}_strideY" name="strideY" value="320" min="32"
                                    max="4096" step="32" required>
                            </div>
                        </div>
                    </div>

                    <!-- Overlap Threshold -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_overlapThreshold">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2" />
                                <path d="M10 14v-4m0-4h.01" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            重叠阈值 (%)
                            <span class="optional-hint">(保留目标的最小可见比例)</span>
                        </label>
                        <div class="range-container">
                            <input type="range" id="{{ tool_id }}_overlapThreshold" name="overlapThreshold" min="0"
                                max="100" value="30">
                            <span class="range-value" id="{{ tool_id }}_overlapThresholdValue">30%</span>
                        </div>
                    </div>

                    <!-- Preview Info -->
                    <div class="preview-info" id="{{ tool_id }}_previewInfo">
                        <h4>参数预览</h4>
                        <div class="preview-grid">
                            <div class="preview-item">
                                <span class="preview-label">窗口:</span>
                                <span class="preview-value" id="{{ tool_id }}_previewWindow">640 × 640</span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-label">步长:</span>
                                <span class="preview-value" id="{{ tool_id }}_previewStride">320 × 320</span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-label">重叠率:</span>
                                <span class="preview-value" id="{{ tool_id }}_previewOverlapRate">50%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="{{ tool_id }}_submitBtn">
                        <span class="btn-text">开始生成</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="{{ tool_id }}_progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="{{ tool_id }}_progressFill"></div>
                    </div>
                    <p class="progress-text" id="{{ tool_id }}_progressText">生成中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="{{ tool_id }}_resultSection" style="display: none;">
                    <div class="result-content" id="{{ tool_id }}_resultContent"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">🎯</div>
                    <h3>智能筛选</h3>
                    <p>根据类别和重叠度自动筛选有效标注</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">📐</div>
                    <h3>精确转换</h3>
                    <p>支持矩形框和多边形标注，精确计算重叠</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">📦</div>
                    <h3>YOLO输出</h3>
                    <p>统一输出为YOLO格式，可直接用于训练</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：重叠度阈值控制标注保留条件，100%表示标注必须完全在窗口内</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/generator.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smart-inputs.js') }}"></script>
</body>

</html>
