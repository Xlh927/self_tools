<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像匹配工具 - Image Matcher</title>
    <meta name="description" content="根据文件名匹配图像并复制">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>图像匹配工具</h1>
            </div>
            <p class="subtitle">根据参考文件夹的文件名，从源文件夹筛选并复制图像</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="matcherForm">
                    <!-- Source Directory -->
                    <div class="form-group">
                        <label for="sourceDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            源图片目录 (Source)
                        </label>
                        <input type="text" id="sourceDir" name="sourceDir" placeholder="例如: /path/to/all_images"
                            required>
                    </div>

                    <!-- Reference Directory -->
                    <div class="form-group">
                        <label for="referenceDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            参考目录 (Reference)
                        </label>
                        <input type="text" id="referenceDir" name="referenceDir" placeholder="例如: /path/to/labels"
                            required>
                        <small class="help-text">将筛选出与此目录中文件同名的图片</small>
                    </div>

                    <!-- Output Directory -->
                    <div class="form-group">
                        <label for="outputDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 3v14M17 10H3" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            输出目录 (Output)
                        </label>
                        <input type="text" id="outputDir" name="outputDir" placeholder="例如: /path/to/matched_images"
                            required>
                    </div>

                    <!-- Options -->
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="dryRun" name="dryRun">
                            <span>仅模拟运行 (Dry Run)</span>
                        </label>
                        <small class="help-text">勾选后不会实际复制文件，仅显示匹配结果</small>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">开始匹配</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">处理中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="result-content" id="resultContent"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">🔍</div>
                    <h3>智能匹配</h3>
                    <p>自动匹配文件名（忽略扩展名），快速筛选目标图片</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">📂</div>
                    <h3>批量处理</h3>
                    <p>支持海量文件快速扫描和复制</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🛡️</div>
                    <h3>安全可靠</h3>
                    <p>支持模拟运行，确认无误后再执行复制</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：源目录包含所有图片，参考目录包含目标文件名</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/matcher.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smart-inputs.js') }}"></script>
</body>

</html>
