<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像匹配工具 - Image Matcher</title>
    <meta name="description" content="根据文件名匹配图像并复制">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>图像匹配工具</h1>
            </div>
            <p class="subtitle">根据参考文件夹的文件名，从源文件夹筛选并复制图像</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="{{ tool_id }}_matcherForm">
                    <!-- Source Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_sourceDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            源图片目录 (Source)
                        </label>
                        <input type="text" id="{{ tool_id }}_sourceDir" name="sourceDir"
                            placeholder="例如: /path/to/source_images" required>
                    </div>

                    <!-- Target Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_targetDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            目标图片目录 (Target)
                        </label>
                        <input type="text" id="{{ tool_id }}_targetDir" name="targetDir"
                            placeholder="例如: /path/to/target_images" required>
                    </div>

                    <!-- Output Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_outputDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 3v14M17 10H3" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            输出目录
                        </label>
                        <input type="text" id="{{ tool_id }}_outputDir" name="outputDir"
                            placeholder="例如: /path/to/output" required>
                    </div>

                    <!-- Match Mode -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_matchMode">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            匹配模式
                        </label>
                        <select id="{{ tool_id }}_matchMode" name="matchMode" required>
                            <option value="filename">文件名匹配 (忽略扩展名)</option>
                            <option value="hash">内容哈希匹配 (MD5)</option>
                            <option value="structure">目录结构匹配</option>
                        </select>
                    </div>

                    <!-- Action Type -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_actionType">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            操作类型
                        </label>
                        <select id="{{ tool_id }}_actionType" name="actionType" required>
                            <option value="copy">复制匹配文件</option>
                            <option value="move">移动匹配文件</option>
                            <option value="delete">删除匹配文件</option>
                            <option value="link">创建硬链接</option>
                        </select>
                    </div>

                    <!-- Options -->
                    <div class="params-section">
                        <h3 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="2" />
                                <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            其他选项
                        </h3>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="{{ tool_id }}_recursive" name="recursive" checked>
                                <span>递归搜索子目录</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="{{ tool_id }}_caseSensitive" name="caseSensitive">
                                <span>区分大小写</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="{{ tool_id }}_dryRun" name="dryRun">
                                <span>仅模拟运行 (Dry Run)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="{{ tool_id }}_submitBtn">
                        <span class="btn-text">开始匹配</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="{{ tool_id }}_progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="{{ tool_id }}_progressFill"></div>
                    </div>
                    <p class="progress-text" id="{{ tool_id }}_progressText">处理中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="{{ tool_id }}_resultSection" style="display: none;">
                    <div class="result-content" id="{{ tool_id }}_resultContent"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">🔍</div>
                    <h3>智能匹配</h3>
                    <p>自动匹配文件名（忽略扩展名），快速筛选目标图片</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">📂</div>
                    <h3>批量处理</h3>
                    <p>支持海量文件快速扫描和复制</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🛡️</div>
                    <h3>安全可靠</h3>
                    <p>支持模拟运行，确认无误后再执行复制</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：源目录包含所有图片，参考目录包含目标文件名</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/matcher.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smart-inputs.js') }}"></script>
</body>

</html>
