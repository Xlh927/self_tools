<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集格式转换工具 - Dataset Converter</title>
    <meta name="description" content="简单易用的VOC与YOLO数据集格式转换工具，支持双向转换">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>数据集格式转换工具</h1>
            </div>
            <p class="subtitle">轻松实现 VOC ↔ YOLO 格式转换</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="conversionForm">
                    <!-- Conversion Type -->
                    <div class="form-group">
                        <label for="conversionType">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            转换方向
                        </label>
                        <select id="conversionType" name="conversionType" required>
                            <option value="voc_to_yolo">VOC → YOLO</option>
                            <option value="yolo_to_voc">YOLO → VOC</option>
                        </select>
                    </div>

                    <!-- Annotations Directory -->
                    <div class="form-group">
                        <label for="annotationsDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            标注文件目录
                            <span class="format-hint" id="annotationsHint">(XML文件)</span>
                        </label>
                        <input type="text" id="annotationsDir" name="annotationsDir"
                            placeholder="例如: /path/to/annotations" required>
                    </div>

                    <!-- Images Directory -->
                    <div class="form-group">
                        <label for="imagesDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            图片文件目录
                        </label>
                        <input type="text" id="imagesDir" name="imagesDir" placeholder="例如: /path/to/images" required>
                    </div>

                    <!-- Output Directory -->
                    <div class="form-group">
                        <label for="outputDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 3v14M17 10H3" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            输出目录
                        </label>
                        <input type="text" id="outputDir" name="outputDir" placeholder="例如: /path/to/output" required>
                    </div>

                    <!-- Classes File -->
                    <div class="form-group" id="classesFileGroup">
                        <label for="classesFile">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h6a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
                                    stroke="currentColor" stroke-width="2" />
                            </svg>
                            类别文件 (classes.txt)
                            <span class="optional-hint" id="classesOptional">(可选)</span>
                        </label>
                        <input type="text" id="classesFile" name="classesFile" placeholder="例如: /path/to/classes.txt">
                        <small class="help-text">每行一个类别名称</small>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">开始转换</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">转换中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="result-content" id="resultContent"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">📁</div>
                    <h3>VOC 格式</h3>
                    <p>XML标注文件，包含边界框坐标和类别信息</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">📝</div>
                    <h3>YOLO 格式</h3>
                    <p>TXT标注文件，归一化的中心点坐标和宽高</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">⚡</div>
                    <h3>快速转换</h3>
                    <p>批量处理，自动检测类别，一键完成转换</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：确保路径正确，程序会自动创建输出目录</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/converter.js') }}"></script>
</body>

</html>
