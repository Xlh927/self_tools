<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集格式转换工具 - Dataset Converter</title>
    <meta name="description" content="简单易用的VOC与YOLO数据集格式转换工具，支持双向转换">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container compact">
        <header class="header compact">
            <div class="logo compact">
                <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>数据集格式转换工具</h1>
            </div>
        </header>

        <main class="main-content compact">
            <div class="card compact">
                <form id="conversionForm">
                    <div class="form-row">
                        <!-- Conversion Type -->
                        <div class="form-group half">
                            <label for="conversionType">
                                <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                                    <path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                转换方向
                            </label>
                            <select id="conversionType" name="conversionType" required>
                                <option value="voc_to_yolo">VOC → YOLO</option>
                                <option value="yolo_to_voc">YOLO → VOC</option>
                            </select>
                        </div>

                        <!-- Classes File -->
                        <div class="form-group half" id="classesFileGroup">
                            <label for="classesFile">
                                <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                                    <path
                                        d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h6a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
                                        stroke="currentColor" stroke-width="2" />
                                </svg>
                                类别文件
                                <span class="optional-hint" id="classesOptional">(可选)</span>
                            </label>
                            <input type="text" id="classesFile" name="classesFile" placeholder="/path/to/classes.txt">
                        </div>
                    </div>

                    <div class="form-row">
                        <!-- Annotations Directory -->
                        <div class="form-group">
                            <label for="annotationsDir">
                                <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                                    <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                                标注文件目录
                                <span class="format-hint" id="annotationsHint">(XML文件)</span>
                            </label>
                            <input type="text" id="annotationsDir" name="annotationsDir"
                                placeholder="/path/to/annotations" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <!-- Images Directory -->
                        <div class="form-group">
                            <label for="imagesDir">
                                <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                                    <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                        stroke-width="2" />
                                    <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                    <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                图片文件目录
                            </label>
                            <input type="text" id="imagesDir" name="imagesDir" placeholder="/path/to/images" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <!-- Output Directory -->
                        <div class="form-group">
                            <label for="outputDir">
                                <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                                    <path d="M10 3v14M17 10H3" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" />
                                </svg>
                                输出目录
                            </label>
                            <input type="text" id="outputDir" name="outputDir" placeholder="/path/to/output" required>
                        </div>
                    </div>

                    <!-- Class Management Section -->
                    <div class="class-management-section" id="classManagementSection" style="display: none;">
                        <h3>类别管理</h3>
                        <div id="classListContainer" class="class-list-container"></div>
                        <div class="class-actions">
                            <button type="button" id="scanClassesBtn" class="secondary-btn">
                                <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                                    <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="2"/>
                                    <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="2"/>
                                </svg>
                                扫描类别
                            </button>
                            <button type="button" id="loadClassesBtn" class="secondary-btn">
                                <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
                                    <path d="M8 13V17M8 17L4 13M8 17L12 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M12 7V3M12 3L16 7M12 3L8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M6 10H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                                加载类别文件
                            </button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="form-actions">
                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span class="btn-text">开始转换</span>
                            <svg class="btn-icon" width="16" height="16" viewBox="0 0 20 20" fill="none">
                                <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">转换中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="result-content" id="resultContent"></div>
                </div>
            </div>
        </main>

        <footer class="footer compact">
            <p>💡 提示：粘贴一个路径后会自动推断其他路径</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home compact">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/converter.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smart-inputs.js') }}"></script>
</body>

</html>
