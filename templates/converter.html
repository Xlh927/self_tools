<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集格式转换工具 - Dataset Converter</title>
    <meta name="description" content="简单易用的VOC与YOLO数据集格式转换工具，支持双向转换">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container compact">
        <header class="header compact">
            <div class="logo compact">
                <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>数据集格式转换工具</h1>
            </div>
        </header>

        <main class="main-content compact">
            <div class="card compact">
                <form id="{{tool_id}}_conversionForm">
                    <!-- Conversion Type -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_conversionType">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            转换类型
                        </label>
                        <select id="{{ tool_id }}_conversionType" name="conversionType" required>
                            <option value="voc_to_yolo">VOC (XML) 转 YOLO (TXT)</option>
                            <option value="yolo_to_voc">YOLO (TXT) 转 VOC (XML)</option>
                        </select>
                    </div>

                    <!-- Annotations Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_annotationsDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            标注文件目录
                        </label>
                        <input type="text" id="{{ tool_id }}_annotationsDir" name="annotationsDir"
                            placeholder="例如: /path/to/annotations" required>
                    </div>

                    <!-- Images Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_imagesDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            图片目录
                        </label>
                        <input type="text" id="{{ tool_id }}_imagesDir" name="imagesDir"
                            placeholder="例如: /path/to/images" required>
                    </div>

                    <!-- Output Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_outputDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 3v14M17 10H3" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            输出目录
                        </label>
                        <input type="text" id="{{ tool_id }}_outputDir" name="outputDir"
                            placeholder="例如: /path/to/output" required>
                    </div>

                    <!-- Classes File (Optional) -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_classesFile">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            类别文件 classes.txt
                            <span class="optional-hint">(可选)</span>
                        </label>
                        <div class="input-with-btn">
                            <input type="text" id="{{ tool_id }}_classesFile" name="classesFile"
                                placeholder="例如: /path/to/classes.txt">
                            <button type="button" id="{{ tool_id }}_loadClassesBtn"
                                class="secondary-btn small">加载</button>
                        </div>
                    </div>

                    <!-- Class Management Section -->
                    <div class="class-management-section">
                        <div class="section-header">
                            <h3>类别管理</h3>
                            <button type="button" id="{{ tool_id }}_scanClassesBtn" class="secondary-btn small">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                扫描类别
                            </button>
                        </div>
                        <div class="class-list-container" id="{{ tool_id }}_classListContainer">
                            <div class="empty-classes-hint">
                                点击"加载"或"扫描类别"来管理数据集类别
                            </div>
                        </div>
                        <input type="hidden" id="{{ tool_id }}_selectedClasses" name="selectedClasses">
                        <input type="hidden" id="{{ tool_id }}_customClasses" name="customClasses">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="{{ tool_id }}_submitBtn">
                        <span class="btn-text">开始转换</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="{{ tool_id }}_progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="{{ tool_id }}_progressFill"></div>
                    </div>
                    <p class="progress-text" id="{{ tool_id }}_progressText">转换中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="{{ tool_id }}_resultSection" style="display: none;">
                    <div class="result-content" id="{{ tool_id }}_resultContent"></div>
                </div>
            </div>
        </main>

        <footer class="footer compact">
            <p>💡 提示：粘贴一个路径后会自动推断其他路径</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home compact">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/converter.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smart-inputs.js') }}"></script>
</body>

</html>
