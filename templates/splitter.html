<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集划分工具 - Dataset Splitter</title>
    <meta name="description" content="将数据集划分为训练集、验证集和测试集">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <rect x="8" y="12" width="24" height="4" rx="2" fill="white" opacity="0.9" />
                    <rect x="8" y="20" width="16" height="4" rx="2" fill="white" opacity="0.7" />
                    <rect x="8" y="28" width="10" height="4" rx="2" fill="white" opacity="0.5" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>数据集划分工具</h1>
            </div>
            <p class="subtitle">智能划分训练集、验证集和测试集</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="{{ tool_id }}_splitterForm">
                    <!-- Dataset Format -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_datasetFormat">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            数据集格式
                        </label>
                        <select id="{{ tool_id }}_datasetFormat" name="datasetFormat" required>
                            <option value="voc">VOC (XML)</option>
                            <option value="yolo">YOLO (TXT)</option>
                        </select>
                    </div>

                    <!-- Images Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_imagesDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            图片目录
                        </label>
                        <input type="text" id="{{ tool_id }}_imagesDir" name="imagesDir"
                            placeholder="例如: /path/to/images" required>
                    </div>

                    <!-- Annotations Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_annotationsDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            标注目录
                        </label>
                        <input type="text" id="{{ tool_id }}_annotationsDir" name="annotationsDir"
                            placeholder="例如: /path/to/annotations" required>
                    </div>

                    <!-- Output Directory -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_outputDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 3v14M17 10H3" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            输出目录
                        </label>
                        <input type="text" id="{{ tool_id }}_outputDir" name="outputDir"
                            placeholder="例如: /path/to/output" required>
                    </div>

                    <!-- Split Ratios -->
                    <div class="params-section">
                        <h3 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <rect x="8" y="2" width="8" height="4" rx="1" ry="1" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            划分比例 (%)
                        </h3>
                        <div class="ratio-sliders">
                            <div class="ratio-item">
                                <div class="ratio-header">
                                    <label for="{{ tool_id }}_trainRatio">训练集 (Train)</label>
                                    <span class="ratio-value" id="{{ tool_id }}_trainValue">70%</span>
                                </div>
                                <input type="range" id="{{ tool_id }}_trainRatio" name="trainRatio" min="0" max="100"
                                    value="70" class="ratio-slider train">
                            </div>
                            <div class="ratio-item">
                                <div class="ratio-header">
                                    <label for="{{ tool_id }}_valRatio">验证集 (Val)</label>
                                    <span class="ratio-value" id="{{ tool_id }}_valValue">20%</span>
                                </div>
                                <input type="range" id="{{ tool_id }}_valRatio" name="valRatio" min="0" max="100"
                                    value="20" class="ratio-slider val">
                            </div>
                            <div class="ratio-item">
                                <div class="ratio-header">
                                    <label for="{{ tool_id }}_testRatio">测试集 (Test)</label>
                                    <span class="ratio-value" id="{{ tool_id }}_testValue">10%</span>
                                </div>
                                <input type="range" id="{{ tool_id }}_testRatio" name="testRatio" min="0" max="100"
                                    value="10" class="ratio-slider test">
                            </div>
                        </div>
                        <div class="ratio-total" id="{{ tool_id }}_ratioTotal">总计: 100%</div>
                    </div>

                    <!-- Options -->
                    <div class="params-section">
                        <h3 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="2" />
                                <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            其他选项
                        </h3>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="{{ tool_id }}_useBackground" name="useBackground">
                                <span>包含背景图片 (无标注图片)</span>
                            </label>
                        </div>
                        <div class="form-group" style="margin-top: 15px;">
                            <label for="{{ tool_id }}_randomSeed">随机种子</label>
                            <input type="number" id="{{ tool_id }}_randomSeed" name="randomSeed" value="42"
                                placeholder="例如: 42">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="{{ tool_id }}_submitBtn">
                        <span class="btn-text">开始划分</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="{{ tool_id }}_progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="{{ tool_id }}_progressFill"></div>
                    </div>
                    <p class="progress-text" id="{{ tool_id }}_progressText">划分中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="{{ tool_id }}_resultSection" style="display: none;">
                    <div class="result-content" id="{{ tool_id }}_resultContent"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">📊</div>
                    <h3>智能划分</h3>
                    <p>自动识别有标注和无标注图片，按比例划分</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🔀</div>
                    <h3>随机打乱</h3>
                    <p>使用随机种子确保结果可重复</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">📁</div>
                    <h3>规范输出</h3>
                    <p>生成标准的train/val/test目录结构</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：比例总和必须为100%，test可以设为0%</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/splitter.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smart-inputs.js') }}"></script>
</body>

</html>
