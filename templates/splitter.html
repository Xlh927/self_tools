<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集划分工具 - Dataset Splitter</title>
    <meta name="description" content="将数据集划分为训练集、验证集和测试集">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <rect x="8" y="12" width="24" height="4" rx="2" fill="white" opacity="0.9" />
                    <rect x="8" y="20" width="16" height="4" rx="2" fill="white" opacity="0.7" />
                    <rect x="8" y="28" width="10" height="4" rx="2" fill="white" opacity="0.5" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>数据集划分工具</h1>
            </div>
            <p class="subtitle">智能划分训练集、验证集和测试集</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="splitterForm">
                    <!-- Format Selection -->
                    <div class="form-group">
                        <label for="format">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h6a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
                                    stroke="currentColor" stroke-width="2" />
                            </svg>
                            标注格式
                        </label>
                        <select id="format" name="format" required>
                            <option value="voc">VOC (XML)</option>
                            <option value="yolo">YOLO (TXT)</option>
                        </select>
                    </div>

                    <!-- Input Directory -->
                    <div class="form-group">
                        <label for="inputDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            数据集目录
                        </label>
                        <input type="text" id="inputDir" name="inputDir" placeholder="例如: /path/to/dataset" required>
                        <small class="help-text">包含图片和标注文件的目录</small>
                    </div>

                    <!-- Output Directory -->
                    <div class="form-group">
                        <label for="outputDir">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 3v14M17 10H3" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            输出目录
                        </label>
                        <input type="text" id="outputDir" name="outputDir" placeholder="例如: /path/to/output" required>
                    </div>

                    <!-- Split Ratios -->
                    <div class="params-section">
                        <h3 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="2" />
                                <path d="M9 9L9 5M9 9L13 9" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            划分比例
                        </h3>

                        <!-- Train Ratio -->
                        <div class="form-group">
                            <label for="trainRatio">
                                训练集 (Train)
                                <span class="format-hint" id="trainValue">70%</span>
                            </label>
                            <input type="range" id="trainRatio" name="trainRatio" min="0" max="100" value="70" step="5"
                                class="threshold-slider">
                            <div class="ratio-preview" id="trainPreview">0 images</div>
                        </div>

                        <!-- Val Ratio -->
                        <div class="form-group">
                            <label for="valRatio">
                                验证集 (Val)
                                <span class="format-hint" id="valValue">20%</span>
                            </label>
                            <input type="range" id="valRatio" name="valRatio" min="0" max="100" value="20" step="5"
                                class="threshold-slider">
                            <div class="ratio-preview" id="valPreview">0 images</div>
                        </div>

                        <!-- Test Ratio -->
                        <div class="form-group">
                            <label for="testRatio">
                                测试集 (Test)
                                <span class="format-hint" id="testValue">10%</span>
                            </label>
                            <input type="range" id="testRatio" name="testRatio" min="0" max="100" value="10" step="5"
                                class="threshold-slider">
                            <div class="ratio-preview" id="testPreview">0 images</div>
                        </div>

                        <div class="ratio-warning" id="ratioWarning" style="display: none;">
                            ⚠️ 比例总和必须为 100%
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="useBackground" name="useBackground">
                            <span>将无标注图片移至 background 文件夹</span>
                        </label>
                        <small class="help-text">启用后，没有标注的图片将被移动到单独的background文件夹</small>
                    </div>

                    <!-- Random Seed -->
                    <div class="form-group">
                        <label for="randomSeed">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 2v4M10 14v4M4 10h4M14 10h4M6 6l2 2M12 12l2 2M6 14l2-2M12 8l2-2"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            </svg>
                            随机种子
                        </label>
                        <input type="number" id="randomSeed" name="randomSeed" value="42" min="0" max="9999">
                        <small class="help-text">用于保证结果可重复，相同种子产生相同的划分</small>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">开始划分</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">划分中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="result-content" id="resultContent"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">📊</div>
                    <h3>智能划分</h3>
                    <p>自动识别有标注和无标注图片，按比例划分</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🔀</div>
                    <h3>随机打乱</h3>
                    <p>使用随机种子确保结果可重复</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">📁</div>
                    <h3>规范输出</h3>
                    <p>生成标准的train/val/test目录结构</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：比例总和必须为100%，test可以设为0%</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/splitter.js') }}"></script>
</body>

</html>
