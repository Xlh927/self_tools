<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像去重工具 - Image Deduplicator</title>
    <meta name="description" content="智能检测并删除重复图像">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <rect x="8" y="8" width="12" height="12" rx="2" stroke="white" stroke-width="2" />
                    <rect x="20" y="20" width="12" height="12" rx="2" stroke="white" stroke-width="2"
                        stroke-dasharray="3 3" opacity="0.6" />
                    <path d="M14 14L26 26" stroke="white" stroke-width="2" stroke-linecap="round" />
                    <circle cx="32" cy="8" r="5" fill="#ff5252" />
                    <path d="M30 8h4M32 6v4" stroke="white" stroke-width="1.5" stroke-linecap="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>图像去重工具</h1>
            </div>
            <p class="subtitle">智能检测并删除重复图像，释放存储空间</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="deduplicatorForm">
                    <!-- Folder Path -->
                    <div class="form-group">
                        <label for="folderPath">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            图像文件夹
                        </label>
                        <input type="text" id="folderPath" name="folderPath" placeholder="例如: /path/to/images" required>
                        <small class="help-text">包含需要去重的图片文件夹</small>
                    </div>

                    <!-- Algorithm Selection -->
                    <div class="params-section">
                        <h3 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="2" />
                                <path d="M9 9L9 5M9 9L13 9" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            检测算法
                        </h3>

                        <!-- Detection Mode -->
                        <div class="form-group">
                            <label for="detectionMode">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                    <path
                                        d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h6a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
                                        stroke="currentColor" stroke-width="2" />
                                </svg>
                                检测模式
                            </label>
                            <select id="detectionMode" name="detectionMode">
                                <option value="perceptual" selected>相似度检测 (推荐)</option>
                                <option value="exact">精确匹配 (MD5)</option>
                            </select>
                            <small class="help-text">相似度检测可识别略微不同的图片，精确匹配只检测完全相同的文件</small>
                        </div>

                        <!-- Hash Algorithm (for perceptual mode) -->
                        <div class="form-group" id="hashAlgorithmGroup">
                            <label for="hashAlgorithm">
                                哈希算法
                            </label>
                            <select id="hashAlgorithm" name="hashAlgorithm">
                                <option value="average" selected>Average Hash (快速)</option>
                                <option value="perceptual">Perceptual Hash (精确)</option>
                                <option value="difference">Difference Hash (平衡)</option>
                                <option value="wavelet">Wavelet Hash (鲁棒)</option>
                            </select>
                        </div>

                        <!-- Similarity Threshold -->
                        <div class="form-group" id="thresholdGroup">
                            <label for="similarityThreshold">
                                相似度阈值
                                <span class="format-hint" id="thresholdValue">5</span>
                            </label>
                            <input type="range" id="similarityThreshold" name="similarityThreshold" min="0" max="20"
                                value="5" step="1" class="threshold-slider">
                            <small class="help-text">值越小越严格，0表示完全相同，推荐值: 3-7</small>
                        </div>
                    </div>

                    <!-- Keep Strategy -->
                    <div class="params-section">
                        <h3 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <path d="M9 2v14M15 8H3" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            保留策略
                        </h3>

                        <div class="form-group">
                            <label for="keepStrategy">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M5 10l5 5L15 5" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                保留哪个文件
                            </label>
                            <select id="keepStrategy" name="keepStrategy">
                                <option value="first" selected>第一个 (默认)</option>
                                <option value="last">最后一个</option>
                                <option value="smallest">最小文件</option>
                                <option value="largest">最大文件</option>
                            </select>
                            <small class="help-text">当发现重复图片时，选择保留哪一个</small>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="button-group">
                        <button type="button" class="submit-btn secondary-btn" id="scanBtn">
                            <span class="btn-text">扫描重复项</span>
                            <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="2" />
                                <path d="M14 14l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            </svg>
                        </button>

                        <button type="button" class="submit-btn" id="removeBtn" disabled>
                            <span class="btn-text">删除重复项</span>
                            <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                        </button>
                    </div>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">扫描中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="result-content" id="resultContent"></div>
                </div>

                <!-- Duplicates Preview -->
                <div class="duplicates-preview" id="duplicatesPreview" style="display: none;">
                    <h3>重复组预览</h3>
                    <div id="duplicatesContainer"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">🔍</div>
                    <h3>智能检测</h3>
                    <p>支持精确匹配和相似度检测两种模式</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">⚡</div>
                    <h3>高效处理</h3>
                    <p>快速扫描大量图片，准确识别重复项</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">💾</div>
                    <h3>释放空间</h3>
                    <p>删除重复图片，节省宝贵的存储空间</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：建议先使用"扫描重复项"查看结果，确认无误后再删除</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/deduplicator.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>

</html>
