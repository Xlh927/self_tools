<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像去重工具 - Image Deduplicator</title>
    <meta name="description" content="智能检测并删除重复图像">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                    <rect x="8" y="8" width="12" height="12" rx="2" stroke="white" stroke-width="2" />
                    <rect x="20" y="20" width="12" height="12" rx="2" stroke="white" stroke-width="2"
                        stroke-dasharray="3 3" opacity="0.6" />
                    <path d="M14 14L26 26" stroke="white" stroke-width="2" stroke-linecap="round" />
                    <circle cx="32" cy="8" r="5" fill="#ff5252" />
                    <path d="M30 8h4M32 6v4" stroke="white" stroke-width="1.5" stroke-linecap="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>图像去重工具</h1>
            </div>
            <p class="subtitle">智能检测并删除重复图像，释放存储空间</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="deduplicatorForm">
                    <!-- Folder Path -->
                    <div class="form-group">
                        <label for="folderPath">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 7v10a2 2 0 002 2h10a2 2 0 002-2V7M3 7l2-4h10l2 4M3 7h14" <label
                                    for="{{ tool_id }}_folderPath">
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                        <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor"
                                            stroke-width="2" />
                                        <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="2" />
                                        <path d="M3 13l4-4 4 4 4-6" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    图片文件夹路径
                        </label>
                        <input type="text" id="{{ tool_id }}_folderPath" name="folderPath"
                            placeholder="例如: /path/to/images" required>
                    </div>

                    <!-- Detection Mode -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_detectionMode">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            检测模式
                        </label>
                        <select id="{{ tool_id }}_detectionMode" name="detectionMode" required>
                            <option value="exact">精确匹配 (MD5)</option>
                            <option value="similar">相似度匹配 (Perceptual Hash)</option>
                        </select>
                    </div>

                    <!-- Hash Algorithm (Visible only for similar mode) -->
                    <div class="form-group" id="{{ tool_id }}_hashAlgoGroup" style="display: none;">
                        <label for="{{ tool_id }}_hashAlgorithm">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            哈希算法
                        </label>
                        <select id="{{ tool_id }}_hashAlgorithm" name="hashAlgorithm">
                            <option value="phash">pHash (感知哈希)</option>
                            <option value="ahash">aHash (平均哈希)</option>
                            <option value="dhash">dHash (差异哈希)</option>
                            <option value="whash">wHash (小波哈希)</option>
                        </select>
                    </div>

                    <!-- Similarity Threshold (Visible only for similar mode) -->
                    <div class="form-group" id="{{ tool_id }}_thresholdGroup" style="display: none;">
                        <label for="{{ tool_id }}_similarityThreshold">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2" />
                                <path d="M10 14v-4m0-4h.01" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            相似度阈值 (0-10)
                            <span class="optional-hint">(越小越严格，0表示完全相同)</span>
                        </label>
                        <div class="range-container">
                            <input type="range" id="{{ tool_id }}_similarityThreshold" name="similarityThreshold"
                                min="0" max="10" value="5">
                            <span class="range-value" id="{{ tool_id }}_thresholdValue">5</span>
                        </div>
                    </div>

                    <!-- Keep Strategy -->
                    <div class="form-group">
                        <label for="{{ tool_id }}_keepStrategy">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            保留策略
                        </label>
                        <select id="{{ tool_id }}_keepStrategy" name="keepStrategy" required>
                            <option value="first">保留第一张</option>
                            <option value="last">保留最后一张</option>
                            <option value="largest">保留分辨率最大的</option>
                            <option value="smallest">保留分辨率最小的</option>
                        </select>
                    </div>

                    <!-- Action Buttons -->
                    <div class="form-actions">
                        <button type="button" class="secondary-btn" id="{{ tool_id }}_scanBtn">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="2" />
                                <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="2" />
                            </svg>
                            扫描重复项
                        </button>
                        <button type="submit" class="submit-btn" id="{{ tool_id }}_removeBtn" disabled>
                            <span class="btn-text">删除重复项</span>
                            <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M3 6h14M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6h14"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </form>

                <!-- Progress Section -->
                <div class="progress-section" id="{{ tool_id }}_progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="{{ tool_id }}_progressFill"></div>
                    </div>
                    <p class="progress-text" id="{{ tool_id }}_progressText">处理中...</p>
                </div>

                <!-- Result Section -->
                <div class="result-section" id="{{ tool_id }}_resultSection" style="display: none;">
                    <div class="result-content" id="{{ tool_id }}_resultContent"></div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">🔍</div>
                    <h3>智能检测</h3>
                    <p>支持精确匹配和相似度检测两种模式</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">⚡</div>
                    <h3>高效处理</h3>
                    <p>快速扫描大量图片，准确识别重复项</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">💾</div>
                    <h3>释放空间</h3>
                    <p>删除重复图片，节省宝贵的存储空间</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>💡 提示：建议先使用"扫描重复项"查看结果，确认无误后再删除</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 10H5M9 6l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        返回首页
    </a>

    <script src="{{ url_for('static', filename='js/deduplicator.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>

</html>
