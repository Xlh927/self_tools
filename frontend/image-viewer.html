<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像浏览器 - Image Viewer</title>
    <link rel="icon" href="assets/self_tools_icon.svg" type="image/svg+xml">
        <link rel="stylesheet" href="/src/styles/viewer.css">
</head>

<body>
    <div id="top-bar">
        <button id="home-btn" onclick="window.location.href='/'" style="margin-right: 15px;" title="返回首页">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            首页
        </button>
        <!-- Path Input Group -->
        <input type="text" id="path-input" placeholder="输入目录路径..." style="flex: 1; min-width: 200px; font-size: 0.875rem;">
        <button id="load-btn">加载</button>

        <div class="toolbar-separator"></div>

        <!-- Grid Controls Group -->
        <div class="toolbar-group">
            <label>网格大小:</label>
            <input type="range" id="grid-size-slider" min="80" max="1000" value="150" style="width: 100px;">
            <span id="grid-size-value" style="min-width: 45px; font-size: 0.875rem;">150px</span>
        </div>

        <!-- Grid Gap Group -->
        <div class="toolbar-group">
            <label>间距:</label>
            <input type="range" id="grid-gap-slider" min="0" max="50" value="10" style="width: 80px;">
            <span id="grid-gap-value" style="min-width: 35px; font-size: 0.875rem;">10px</span>
        </div>

        <!-- Display Options Group -->
        <div class="toolbar-group">
            <label>
                <input type="checkbox" id="use-thumbnails-toggle" style="margin-right: 4px;">
                缩略图
            </label>
        </div>

        <!-- Scroll Mode Group -->
        <div class="toolbar-group">
            <label>滚动:</label>
            <select id="scroll-mode-select"
                style="padding: 4px 8px; background-color: var(--input-bg-color); border: 1px solid var(--input-border-color); color: var(--input-text-color); border-radius: 4px; font-size: 0.875rem; cursor: pointer;">
                <option value="smart">智能</option>
                <option value="center">居中</option>
            </select>
        </div>

        <!-- Brightness Controls Group -->
        <div class="toolbar-group">
            <label>亮度:</label>
            <input type="range" id="brightness-slider" min="0" max="200" value="100" style="width: 80px;">
            <span id="brightness-value" style="min-width: 40px; font-size: 0.875rem;">100%</span>
            <button id="reset-brightness-btn" style="padding: 4px 8px; font-size: 0.875rem;">重置</button>
        </div>

        <div class="toolbar-separator"></div>

        <!-- Action Buttons Group -->
        <button id="clear-cache-btn" style="background-color: #ff9800; padding: 6px 12px; font-size: 0.875rem;"
            title="清除缩略图缓存">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
            清除缓存
        </button>
        <button id="settings-btn" style="padding: 6px 12px; font-size: 0.875rem;">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            设置
        </button>
    </div>

    <div id="main-container">
        <div id="grid-view"></div>
    </div>

    <div id="single-view">
        <button id="close-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18"></path>
                <path d="M6 6l12 12"></path>
            </svg>
        </button>
        <button id="prev-btn" class="nav-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>
        <img id="single-image" src="" alt="查看">
        <button id="next-btn" class="nav-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"></path>
            </svg>
        </button>
        <div id="image-info"></div>
    </div>

    <div id="settings-modal">
        <div id="settings-content">
            <h2>设置</h2>
            <div class="setting-row">
                <label>主题:</label>
                <select id="theme-select"
                    style="padding: 5px; background-color: var(--input-bg-color); border: 1px solid var(--input-border-color); color: var(--input-text-color); border-radius: 4px; width: 100px; font-size: 0.875rem;">
                    <option value="nomacs">Nomacs</option>
                    <option value="douyin">Douyin</option>
                    <option value="bilibili">Bilibili</option>
                    <option value="youtube">YouTube</option>
                    <option value="wechat">WeChat</option>
                </select>
            </div>
            <div class="setting-row">
                <label>下一张图片:</label>
                <input type="text" id="key-next" style="font-size: 0.875rem;">
            </div>
            <div class="setting-row">
                <label>上一张图片:</label>
                <input type="text" id="key-prev" style="font-size: 0.875rem;">
            </div>
            <div class="setting-row">
                <label>清除分类:</label>
                <input type="text" id="key-clear" style="font-size: 0.875rem;">
            </div>

            <h3>分类</h3>
            <div id="class-list"></div>
            <button id="add-class-btn" style="margin-top: 10px; font-size: 0.875rem;">+ 添加分类</button>

            <div style="margin-top: 20px; text-align: right;">
                <button id="save-settings-btn" style="font-size: 0.875rem;">保存</button>
                <button id="cancel-settings-btn" style="background-color: #555; font-size: 0.875rem;">取消</button>
            </div>
        </div>
    </div>

    <!-- Floating Info Panel -->
    <div id="info-panel">
        <h3>统计信息</h3>
        <div class="info-section">
            <div class="info-section-title">分类</div>
            <div id="classification-stats"></div>
        </div>
        <div class="info-section">
            <div class="sort-control">
                <label>排序:</label>
                <select id="sort-select" style="font-size: 0.875rem;">
                    <option value="name_desc">名称 ↓</option>
                    <option value="name_asc">名称 ↑</option>
                    <option value="date_desc">日期 ↓</option>
                    <option value="date_asc">日期 ↑</option>
                </select>
            </div>
        </div>
    </div>

        <script type="module" src="/src/viewer/index.js"></script>
</body>

</html>
