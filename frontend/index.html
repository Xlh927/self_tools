<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Tools - CV 数据集工具平台</title>
    <link rel="icon" href="assets/self_tools_icon.svg" type="image/svg+xml">
    <!-- 立即设置主题，避免闪烁 -->
    <script>
        (function() {
            const currentTheme = localStorage.getItem('app-theme') || 'bilibili';
            document.documentElement.setAttribute('data-theme', currentTheme);
        })();
    </script>
    <link rel="stylesheet" href="src/styles/theme.css">
    <link rel="stylesheet" href="src/styles/globals.css">
    <link rel="stylesheet" href="src/styles/animations.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .landing-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-2xl);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .landing-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .landing-title {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            /* 初始状态可见，避免闪烁 */
            opacity: 1;
            will-change: transform, opacity;
        }

        .landing-title.loaded {
            animation: fadeInDown 0.4s ease-out;
        }

        .landing-subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            /* 初始状态可见，避免闪烁 */
            opacity: 1;
            will-change: transform, opacity;
        }

        .landing-subtitle.loaded {
            animation: fadeInUp 0.4s ease-out 0.1s both;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: var(--spacing-lg);
            width: 100%;
            max-width: 1000px;
        }

        .app-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: var(--shadow-md);
            /* 初始状态可见，避免闪烁 */
            opacity: 1;
            will-change: transform, opacity;
        }

        /* 仅在页面加载完成后才应用动画 */
        .app-card.loaded {
            animation: fadeInUp 0.4s ease-out;
        }

        .app-card:nth-child(1).loaded {
            animation-delay: 0.1s;
        }

        .app-card:nth-child(2).loaded {
            animation-delay: 0.2s;
        }

        .app-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
            background: var(--bg-glass-hover);
        }

        .app-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .app-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .theme-switcher {
            position: fixed;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            display: flex;
            gap: 0.4rem;
            padding: 0.3rem;
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--glass-blur);
            z-index: 100;
        }

        .theme-btn {
            padding: 0.4rem 0.6rem;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .theme-btn.active {
            background: var(--gradient-primary);
            color: white;
        }

        .theme-btn:hover:not(.active) {
            background: var(--bg-secondary);
        }
    </style>
</head>

<body>
    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <button class="theme-btn active" data-theme="bilibili">
            <span>📺</span>
            <span>B站</span>
        </button>
        <button class="theme-btn" data-theme="default">
            <span>💎</span>
            <span>CH</span>
        </button>
        <button class="theme-btn" data-theme="douyin">
            <span>🎵</span>
            <span>TT</span>
        </button>
        <button class="theme-btn" data-theme="youtube">
            <span>🔴</span>
            <span>YT</span>
        </button>
    </div>

    <div class="landing-container">
        <div class="landing-header">
            <h1 class="landing-title">Self Tools</h1>
            <p class="landing-subtitle">一站式 CV 数据集处理与浏览平台</p>
        </div>

        <div class="apps-grid">
            <a href="/cv-tools" class="app-card">
                <div class="app-icon">🖼️</div>
                <h2 class="app-title">CV Tools</h2>
                <p class="app-description">
                    数据集生产工具链<br>
                    转换 • 裁剪 • 生成 • 划分 • 去重 • 匹配 • 可视化 • 清洗 • 增强
                </p>
            </a>

            <a href="/image-viewer" class="app-card">
                <div class="app-icon">🔍</div>
                <h2 class="app-title">Image Viewer</h2>
                <p class="app-description">
                    高效目录浏览与分拣<br>
                    快捷键分类 • 缩略图缓存 • 分类联动
                </p>
            </a>
        </div>
    </div>

    <script>
        // Theme management (主题已在 head 中设置，这里只更新按钮状态)
        const currentTheme = localStorage.getItem('app-theme') || 'bilibili';
        
        // 确保主题已应用（双重保险）
        document.documentElement.setAttribute('data-theme', currentTheme);

        // Update active button
        document.querySelectorAll('.theme-btn').forEach(btn => {
            if (btn.dataset.theme === currentTheme) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }

            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('app-theme', theme);

                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // 页面加载完成后添加动画类，避免初始闪烁
        document.addEventListener('DOMContentLoaded', function() {
            // 等待一帧，确保样式已应用
            requestAnimationFrame(function() {
                document.querySelectorAll('.landing-title, .landing-subtitle, .app-card').forEach(el => {
                    el.classList.add('loaded');
                });
            });
        });
    </script>
</body>

</html>
